services:
  - type: web
    name: sentinel-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NASA_FIRMS_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.11